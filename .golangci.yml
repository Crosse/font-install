version: "2"
linters:
  default: all
  disable:
    # less useful
    - cyclop
    - exhaustruct
    - forbidigo
    - funlen
    - gochecknoglobals
    - ireturn
    - mnd
    - nolintlint
    - varnamelen

    # really don't think I need to worry about it in a project this small
    - err113

    # no allow list is configured, so it flags every third-party import
    - depguard
    # renamed copy of exhaustruct
    - exhaustruct_v5
    # rejects idiomatic `if err := ...; err != nil`
    - noinlineerr
    # deprecated in favor of wsl_v5
    - wsl
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      config:
        G306: "0644"
    misspell:
      ignore-rules:
        - strat
    nlreturn:
      block-size: 2
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - paralleltest
        text: does not use range value in test Run
      - linters:
          - errcheck
        text: Error return value of (Info|Error)f? is not checked
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
