name: Releases

on:
  push:
    tags:
    - '*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: "setup go"
      uses: actions/setup-go@v7
      with:
        cache: true
        go-version: stable

    - name: build
      run: make zip

    - name: "create release"
      uses: ncipollo/release-action@v1
      with:
        artifactErrorsFailBuild: true
        artifacts: "release/*.zip"
        draft: true
        generateReleaseNotes: true
